<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酪梨航空 Avocado Airlines - 訂票系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3ebe3',
                            200: '#c7d7c7',
                            300: '#a3bfa3',
                            400: '#84a384',
                            500: '#648564', // 主鼠尾草綠
                            600: '#4d6b4d',
                            700: '#3f563f',
                            800: '#344634',
                            900: '#2c3b2c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FullCalendar CDN -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fc-event { cursor: pointer; border-radius: 6px; padding: 2px 4px; }
        .fc-header-toolbar { font-size: 0.9rem; }
        .fc-button-primary { background-color: #648564 !important; border-color: #648564 !important; }
        .fc-button-primary:hover { background-color: #4d6b4d !important; border-color: #4d6b4d !important; }
    </style>
</head>
<body class="bg-[#f7f9f7] font-sans text-slate-700">

    <!-- 導覽列 -->
    <nav class="bg-sage-600 text-white shadow-sm border-b border-sage-700">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('booking')">
                <span class="text-2xl">🥑</span>
                <span class="font-semibold text-lg tracking-wider text-sage-50">Avocado Airlines 酪梨航空</span>
            </div>
            <div class="flex space-x-3">
                <button onclick="switchTab('booking')" class="px-4 py-2 rounded-lg text-sm bg-sage-700/50 hover:bg-sage-700 transition">
                    <i class="fa-solid fa-plane-departure mr-1.5"></i> 線上訂票
                </button>
                <button id="nav-admin-btn" onclick="openAdminModal()" class="px-4 py-2 bg-sage-800 text-sage-100 rounded-lg text-sm hover:bg-sage-900 transition shadow-sm">
                    <i class="fa-solid fa-user-gear mr-1.5"></i> 管理員登入
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- 1. 前台訂票區塊 -->
        <div id="section-booking" class="space-y-8">
            <!-- 搜尋/訂票卡片 -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-sage-100">
                <div class="border-b border-sage-100 pb-4 mb-6">
                    <h2 class="text-xl font-semibold text-sage-800 flex items-center gap-2">
                        <i class="fa-solid fa-compass text-sage-500"></i> 預訂您的完美旅程
                    </h2>
                    <p class="text-sm text-slate-400 mt-1">選擇您的目的地與日期，即刻開啟美好航程</p>
                </div>

                <form id="booking-form" onsubmit="handleBooking(event)" class="grid grid-cols-1 md:grid-cols-4 gap-5">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5">目的地區域</label>
                        <select id="book-region" onchange="filterRoutesByRegion()" class="w-full bg-sage-50/50 border border-sage-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400 text-slate-700">
                            <option value="ALL">全部區域</option>
                            <option value="Northeast Asia">東北亞 (Northeast Asia)</option>
                            <option value="China Region">中港澳 (China Region)</option>
                            <option value="South East Asia">東南亞 (South East Asia)</option>
                            <option value="Middle East / India">中東 / 印度 (Middle East / India)</option>
                            <option value="Europe">歐洲 (Europe)</option>
                            <option value="Oceania">大洋洲 (Oceania)</option>
                            <option value="America">美洲 (America)</option>
                            <option value="Africa">非洲 (Africa)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5">航班航線</label>
                        <select id="book-route" required class="w-full bg-sage-50/50 border border-sage-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400 text-slate-700">
                            <!-- JS 動態生成 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5">出發日期</label>
                        <input type="date" id="book-date" required class="w-full bg-sage-50/50 border border-sage-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400 text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1.5">乘客姓名</label>
                        <input type="text" id="book-passenger" placeholder="例如：林雅婷" required class="w-full bg-sage-50/50 border border-sage-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400 text-slate-700">
                    </div>
                    <div class="md:col-span-4 flex justify-end mt-2">
                        <button type="submit" class="bg-sage-600 text-white font-medium px-8 py-3 rounded-xl hover:bg-sage-700 transition shadow-sm flex items-center gap-2">
                            <span>確認預訂</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- 航點一覽表 -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-sage-100">
                <h3 class="text-lg font-semibold text-sage-800 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-earth-americas text-sage-500"></i> 航點總覽 (Routes)
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-sage-50/80 text-sage-700 text-xs uppercase tracking-wider border-b border-sage-100">
                                <th class="p-3.5">區域</th>
                                <th class="p-3.5">代碼</th>
                                <th class="p-3.5">城市</th>
                                <th class="p-3.5">航班號</th>
                                <th class="p-3.5">飛航日</th>
                                <th class="p-3.5">機型</th>
                                <th class="p-3.5">起飛時間 (TPE)</th>
                            </tr>
                        </thead>
                        <tbody id="routes-table-body" class="divide-y divide-sage-50 text-sm">
                            <!-- 動態填入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. 後台管理區塊 (登入後顯示) -->
        <div id="section-admin" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-sage-100">
                <div class="flex items-center space-x-3">
                    <span class="bg-sage-100 text-sage-800 text-xs px-3 py-1 rounded-full font-medium">後台管理員</span>
                    <h2 class="text-lg font-semibold text-slate-800">控制台主頁</h2>
                </div>
                <button onclick="adminLogout()" class="text-xs text-rose-500 hover:text-rose-700 font-medium px-3 py-1.5 rounded-lg border border-rose-100 hover:bg-rose-50 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出系統
                </button>
            </div>

            <!-- 後台 Tab 切換 -->
            <div class="flex space-x-2 border-b border-sage-200/60 pb-1">
                <button id="btn-tab-calendar" onclick="switchAdminTab('calendar')" class="px-5 py-2.5 text-sm font-medium border-b-2 border-sage-600 text-sage-700 transition">
                    <i class="fa-regular fa-calendar-days mr-1.5"></i> 出發日曆 (訂票結果)
                </button>
                <button id="btn-tab-orders" onclick="switchAdminTab('orders')" class="px-5 py-2.5 text-sm font-medium text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-receipt mr-1.5"></i> 所有訂票紀錄
                </button>
                <button id="btn-tab-routes" onclick="switchAdminTab('routes')" class="px-5 py-2.5 text-sm font-medium text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-plane mr-1.5"></i> 航線資料管理
                </button>
            </div>

            <!-- 日曆面板 -->
            <div id="admin-panel-calendar" class="bg-white p-8 rounded-2xl shadow-sm border border-sage-100">
                <h3 class="text-base font-semibold mb-6 text-slate-700">航班與旅客出發日曆</h3>
                <div id="calendar"></div>
            </div>

            <!-- 訂票紀錄面板 -->
            <div id="admin-panel-orders" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-sage-100">
                <h3 class="text-base font-semibold mb-6 text-slate-700">所有訂票總覽</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-sage-50/80 text-sage-700 text-xs uppercase tracking-wider">
                                <th class="p-3.5">訂單ID</th>
                                <th class="p-3.5">乘客</th>
                                <th class="p-3.5">航班編號</th>
                                <th class="p-3.5">目的地</th>
                                <th class="p-3.5">出發日期</th>
                                <th class="p-3.5">起飛時間</th>
                                <th class="p-3.5">操作</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-sage-50 text-sm">
                            <!-- 動態填入 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 航線管理面板 -->
            <div id="admin-panel-routes" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-sage-100 space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-base font-semibold text-slate-700">航線設置與維護</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-sage-50/80 text-sage-700 text-xs uppercase tracking-wider">
                                <th class="p-3.5">區域</th>
                                <th class="p-3.5">代碼</th>
                                <th class="p-3.5">城市</th>
                                <th class="p-3.5">航班號</th>
                                <th class="p-3.5">時間</th>
                                <th class="p-3.5">操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-routes-table-body" class="divide-y divide-sage-50 text-sm">
                            <!-- 動態填入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin 登入彈窗 -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-5 border border-sage-100">
            <div class="flex justify-between items-center border-b border-sage-100 pb-3">
                <h3 class="text-lg font-semibold text-slate-800">管理員登入</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">帳號</label>
                    <input type="text" id="admin-user" required class="w-full bg-sage-50/50 border border-sage-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">密碼</label>
                    <input type="password" id="admin-pass" required class="w-full bg-sage-50/50 border border-sage-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">
                </div>
                <p class="text-xs text-slate-400">預設：admin / avocado123</p>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAdminModal()" class="px-4 py-2 border border-slate-200 text-slate-600 text-sm rounded-xl hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-5 py-2 bg-sage-600 text-white text-sm rounded-xl hover:bg-sage-700 transition">登入</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const defaultRoutes = [
            { region: "Northeast Asia", code: "CTS", city: "Sapporo", flight: "AH 110", days: "Daily", aircraft: "A359", time: "8:00" },
            { region: "Northeast Asia", code: "AKJ", city: "Asahikawa", flight: "AH 112", days: "1,3,5,7", aircraft: "32Q", time: "7:30" },
            { region: "Northeast Asia", code: "HKD", city: "Hakkodate", flight: "AH 114", days: "1,3,5,6,7", aircraft: "32Q", time: "9:30" },
            { region: "Northeast Asia", code: "SDJ", city: "Sendai", flight: "AH 116", days: "Daily", aircraft: "A339", time: "9:00" },
            { region: "Northeast Asia", code: "HND (TSA)", city: "Tokyo Haneda", flight: "AH 150", days: "DailyX2", aircraft: "A339", time: "7:00/17:00" },
            { region: "Northeast Asia", code: "NRT", city: "Tokyo Narita", flight: "AH 120", days: "DailyX2", aircraft: "A359/K", time: "8:00/18:00" },
            { region: "Northeast Asia", code: "KIX", city: "Osaka Kansai", flight: "AH 130", days: "DailyX2", aircraft: "A359/A339", time: "8:30/11:00" },
            { region: "Northeast Asia", code: "ICN", city: "Seoul(Incheon)", flight: "AH 146", days: "DailyX2", aircraft: "A359/32Q", time: "9:30/17:00" },
            { region: "China Region", code: "PVG", city: "Shanghai", flight: "AH 1101", days: "1,4", aircraft: "A359", time: "10:30" },
            { region: "China Region", code: "HKG", city: "Hong Kong", flight: "AH 601", days: "DailyX2", aircraft: "A3(3,5)9/32Q", time: "15:30/19:00" },
            { region: "South East Asia", code: "SIN", city: "Singapore", flight: "AH 201", days: "DailyX2", aircraft: "A35K/32Q", time: "9:30/15:00" },
            { region: "South East Asia", code: "BKK", city: "Bangkok", flight: "AH 205", days: "Daily", aircraft: "A359", time: "10:40" },
            { region: "Middle East / India", code: "DXB", city: "Dubai", flight: "AH 252", days: "Daily", aircraft: "A359", time: "22:30" },
            { region: "Europe", code: "CDG", city: "Paris", flight: "AH 302", days: "Daily", aircraft: "A339", time: "21:00" },
            { region: "Europe", code: "LHR", city: "London", flight: "AH 300", days: "Daily", aircraft: "A339", time: "22:30" },
            { region: "Oceania", code: "SYD", city: "Sydney", flight: "AH 401", days: "Daily", aircraft: "A359", time: "15:30" },
            { region: "America", code: "LAX", city: "Los Angeles", flight: "AH01", days: "Daily", aircraft: "A359", time: "00:15" },
            { region: "America", code: "JFK", city: "New York", flight: "AH10", days: "Daily", aircraft: "A359", time: "19:30" },
            { region: "Africa", code: "EGG", city: "New Eggland", flight: "AH 701", days: "1,3,5", aircraft: "321NY", time: "19:25" }
        ];

        let routes = JSON.parse(localStorage.getItem('avocado_routes')) || defaultRoutes;
        let bookings = JSON.parse(localStorage.getItem('avocado_bookings')) || [
            { id: 'ORD-101', passenger: '陳大明', flight: 'AH 120', city: 'Tokyo Narita', date: new Date().toISOString().split('T')[0], time: '8:00' }
        ];
        let isAdminLoggedIn = false;
        let calendar = null;

        window.onload = function() {
            renderRoutesTable();
            populateBookingOptions();
            renderOrdersTable();
            renderAdminRoutesTable();
        };

        function switchTab(tab) {
            if (tab === 'admin' && !isAdminLoggedIn) {
                openAdminModal();
                return;
            }

            document.getElementById('section-booking').classList.toggle('hidden', tab !== 'booking');
            document.getElementById('section-admin').classList.toggle('hidden', tab !== 'admin');

            if (tab === 'admin' && !calendar) {
                setTimeout(initCalendar, 100);
            }
        }

        function renderRoutesTable() {
            const tbody = document.getElementById('routes-table-body');
            tbody.innerHTML = routes.map(r => `
                <tr class="hover:bg-sage-50/50 transition">
                    <td class="p-3.5"><span class="bg-sage-100/70 text-sage-800 px-2.5 py-1 rounded-md text-xs font-medium">${r.region}</span></td>
                    <td class="p-3.5 font-medium text-sage-700">${r.code}</td>
                    <td class="p-3.5 text-slate-700">${r.city}</td>
                    <td class="p-3.5 font-mono text-xs text-slate-500">${r.flight}</td>
                    <td class="p-3.5 text-slate-600">${r.days}</td>
                    <td class="p-3.5 text-slate-400 text-xs">${r.aircraft}</td>
                    <td class="p-3.5 text-slate-600">${r.time}</td>
                </tr>
            `).join('');
        }

        function populateBookingOptions() {
            const region = document.getElementById('book-region').value;
            const select = document.getElementById('book-route');
            const filtered = region === 'ALL' ? routes : routes.filter(r => r.region === region);
            
            select.innerHTML = filtered.map(r => `
                <option value="${r.flight}|${r.city}|${r.time}">
                    ${r.flight} - ${r.city} (${r.code}) [起飛: ${r.time}]
                </option>
            `).join('');
        }

        function filterRoutesByRegion() {
            populateBookingOptions();
        }

        function handleBooking(e) {
            e.preventDefault();
            const routeVal = document.getElementById('book-route').value;
            const date = document.getElementById('book-date').value;
            const passenger = document.getElementById('book-passenger').value;

            if (!routeVal || !date || !passenger) return;

            const [flight, city, time] = routeVal.split('|');
            const newBooking = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                passenger,
                flight,
                city,
                date,
                time
            };

            bookings.push(newBooking);
            localStorage.setItem('avocado_bookings', JSON.stringify(bookings));
            alert(`🎉 預訂成功！\n\n訂單編號：${newBooking.id}\n乘客姓名：${passenger}\n預訂航班：${flight} 往 ${city}\n出發日期：${date}`);

            document.getElementById('booking-form').reset();
            populateBookingOptions();
            
            renderOrdersTable();
            if (calendar) calendar.refetchEvents();
        }

        function openAdminModal() {
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;

            if (u === 'admin' && p === 'avocado123') {
                isAdminLoggedIn = true;
                closeAdminModal();
                document.getElementById('nav-admin-btn').innerText = "進入後台控制頁";
                document.getElementById('nav-admin-btn').onclick = () => switchTab('admin');
                switchTab('admin');
            } else {
                alert('帳號或密碼錯誤！');
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            document.getElementById('nav-admin-btn').innerHTML = `<i class="fa-solid fa-user-gear mr-1.5"></i> 管理員登入`;
            document.getElementById('nav-admin-btn').onclick = openAdminModal;
            switchTab('booking');
        }

        function switchAdminTab(tab) {
            document.getElementById('admin-panel-calendar').classList.toggle('hidden', tab !== 'calendar');
            document.getElementById('admin-panel-orders').classList.toggle('hidden', tab !== 'orders');
            document.getElementById('admin-panel-routes').classList.toggle('hidden', tab !== 'routes');

            if (tab === 'calendar' && calendar) {
                calendar.render();
            }
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-tw',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                events: function(fetchInfo, successCallback, failureCallback) {
                    const events = bookings.map(b => ({
                        id: b.id,
                        title: `✈️ ${b.passenger} (${b.flight})`,
                        start: `${b.date}T${b.time.split('/')[0]}:00`,
                        backgroundColor: '#648564',
                        borderColor: '#4d6b4d'
                    }));
                    successCallback(events);
                },
                eventClick: function(info) {
                    alert('📌 預訂詳情:\n' + info.event.title);
                }
            });
            calendar.render();
        }

        function renderOrdersTable() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = bookings.map(b => `
                <tr class="hover:bg-sage-50/50 transition">
                    <td class="p-3.5 font-mono text-xs font-bold text-slate-400">${b.id}</td>
                    <td class="p-3.5 font-medium text-slate-700">${b.passenger}</td>
                    <td class="p-3.5 font-mono text-sage-700">${b.flight}</td>
                    <td class="p-3.5 text-slate-600">${b.city}</td>
                    <td class="p-3.5 text-slate-600">${b.date}</td>
                    <td class="p-3.5 text-slate-500">${b.time}</td>
                    <td class="p-3.5">
                        <button onclick="deleteBooking('${b.id}')" class="text-rose-400 hover:text-rose-600 text-xs">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteBooking(id) {
            if (confirm('確定要刪除這筆預訂紀錄嗎？')) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('avocado_bookings', JSON.stringify(bookings));
                renderOrdersTable();
                if (calendar) calendar.refetchEvents();
            }
        }

        function renderAdminRoutesTable() {
            const tbody = document.getElementById('admin-routes-table-body');
            tbody.innerHTML = routes.map((r, index) => `
                <tr class="hover:bg-sage-50/50 transition">
                    <td class="p-3.5 text-slate-600">${r.region}</td>
                    <td class="p-3.5 font-medium text-sage-700">${r.code}</td>
                    <td class="p-3.5 text-slate-700">${r.city}</td>
                    <td class="p-3.5 font-mono text-xs text-slate-500">${r.flight}</td>
                    <td class="p-3.5 text-slate-600">${r.time}</td>
                    <td class="p-3.5">
                        <button onclick="deleteRoute(${index})" class="text-rose-400 hover:text-rose-600 text-xs">移除</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteRoute(index) {
            if (confirm('確定要移除此航線嗎？')) {
                routes.splice(index, 1);
                localStorage.setItem('avocado_routes', JSON.stringify(routes));
                renderRoutesTable();
                renderAdminRoutesTable();
                populateBookingOptions();
            }
        }
    </script>
</body>
</html>
